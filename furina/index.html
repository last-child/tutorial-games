<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>원신 비주얼노벨</title>
  </head>
  <body>
    <div id="app">
      <div id="frame">
        <div id="scene">
          <img class="bg" id="bg-a" alt="" />
          <img class="bg" id="bg-b" alt="" />
          <div id="sprite-pos">
            <div id="sprite-zoom">
              <div id="sprite-shake">
                <img class="sprite" id="sp-a" alt="푸리나" />
                <img class="sprite" id="sp-b" alt="푸리나" />
              </div>
            </div>
          </div>
          <div id="shade"></div>
        </div>

        <div id="textbox" class="hidden" data-speaker="narration">
          <div id="nametag"></div>
          <p id="text"></p>
          <div id="next" aria-hidden="true"></div>
        </div>

        <div id="choices" inert></div>

        <div id="backlog" role="dialog" aria-label="대사 로그" inert>
          <div class="log-head">
            <span>LOG</span>
            <button type="button" id="log-close">닫기</button>
          </div>
          <ol id="log-list"></ol>
        </div>

        <div id="titlecard" inert>
          <div class="head"></div>
          <div class="rule"></div>
          <div class="sub"></div>
          <button type="button">처음부터 다시</button>
        </div>

        <div id="title-screen">
          <h1>원신 비주얼노벨</h1>
          <div class="hint">클릭하면 시작</div>
          <div class="note">사운드가 재생됩니다</div>
        </div>

        <div id="notice" inert>
          <p>본 작품은 「원신」의 비공식 2차 창작물입니다.<br />원작의 권리는 HoYoverse에 있습니다.</p>
        </div>

        <div id="controls">
          <button type="button" id="log" class="pill" aria-expanded="false" aria-controls="backlog" title="대사 로그">LOG</button>
          <button type="button" id="mute" aria-label="음소거" aria-pressed="false" title="음소거">
            <svg class="on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" /><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" /></svg>
            <svg class="off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" /><path d="M17 9.5l5 5M22 9.5l-5 5" fill="none" /></svg>
          </button>
          <button type="button" id="fullscreen" aria-label="전체 화면" title="전체 화면" hidden>
            <svg class="on" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" /></svg>
            <svg class="off" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" fill="none" /></svg>
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
